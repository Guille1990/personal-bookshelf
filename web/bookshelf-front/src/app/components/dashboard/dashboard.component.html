<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Personal Bookshelf</h1>
    <div class="user-info" *ngIf="currentUser">
      <span>Bienvenido, {{ currentUser.username }}!</span>
      <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="welcome-card">
      <h2>¡Bienvenido a tu biblioteca personal!</h2>
      <p>Aquí podrás gestionar todos tus libros y mangas.</p>
      
      <div class="stats-grid">
        <div class="stat-card">
          <h3>0</h3>
          <p>Libros</p>
        </div>
        <div class="stat-card">
          <h3>0</h3>
          <p>Mangas</p>
        </div>
        <div class="stat-card">
          <h3>0</h3>
          <p>Etiquetas</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" (click)="goToLibrary()">Agregar Libro</button>
        <button class="btn-secondary" (click)="goToLibrary()">Ver Biblioteca</button>
      </div>
    </div>
  </main>
</div>
